name: "✨ 기능 제안"
description: "새로운 기능을 제안해주세요!"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        ## ✅ 작업 분류
        > 기능 구현을 위해 필요한 작업을 선택해주세요.

  - type: checkboxes
    id: task_classification
    attributes:
      label: "작업 분류"
      options:
        - label: "요구사항 분석"
        - label: "디자인/설계"
        - label: "개발"
        - label: "테스트"

  - type: markdown
    attributes:
      value: |
        ## 📝 설명
        > 제안하는 기능에 대해 설명해주세요.

  - type: textarea
    id: description
    attributes:
      label: "설명"
      description: "제안하는 기능에 대한 자세한 설명을 입력하세요."
      placeholder: "기능 설명을 입력하세요."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 📋 참고 자료
        > 제안하는 기능과 관련된 자료를 첨부해주세요.
        <!-- ex: 관련 문서, 스크린샷, 참고 링크 등 -->

  - type: textarea
    id: etc
    attributes:
      label: "참고 자료"
      description: "참고 자료를 입력하세요."
      placeholder: "관련 문서, 스크린샷, 참고 링크 등을 입력하세요."
