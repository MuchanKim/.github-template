  description: "PR 제출 전에 체크해주세요."
  items:
    - "작성한 코드가 정상적으로 동작하나요?"
    - "사전에 정해진 컨벤션을 지켜서 코드를 작성했나요?"
    - "Pull Request를 보내기 전 리뷰어와 할당자를 설정했나요?"
    - "관련 이슈 번호를 작성했나요?"

review_notes:
  description: "리뷰어에게 전달할 내용이 있다면 작성해주세요."
