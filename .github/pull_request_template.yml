pr_type:
  description: "해당하는 PR 타입을 체크해주세요."
  options:
    - Feature: 기능 추가
    - Chore: 환경 설정
    - Refactor: 코드 개선
    - Style: 디자인 수정
    - Bugfix: 버그 수정

description:
  description: "작업 내용을 설명해주세요."

related_issues:
  description: "관련된 이슈를 연결해주세요."

